<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTENDANCE.SYS · Ethical Hacking & Forex Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{
    --green:#00ff41;
    --green-dim:#0a7a1f;
    --green-glow:rgba(0,255,65,.55);
    --bg:#0d0208;
    --panel:rgba(0,20,5,.72);
    --border:rgba(0,255,65,.35);
    --text:#c8ffd4;
    --cyan:#00e5ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Share Tech Mono', 'JetBrains Mono', monospace;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* Matrix canvas behind everything */
  #matrix{
    position:fixed;inset:0;
    z-index:0;
    display:block;
  }
  body::after{
    content:"";
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.85) 100%),
      repeating-linear-gradient(0deg, rgba(0,255,65,.04) 0px, rgba(0,255,65,.04) 1px, transparent 1px, transparent 3px);
  }

  .container{
    position:relative;z-index:2;
    max-width:900px;
    margin:0 auto;
    padding:22px 16px 60px;
  }

  /* HEADER */
  header{
    display:flex;justify-content:space-between;align-items:center;
    gap:14px;flex-wrap:wrap;
    padding:14px 16px;
    border:1px solid var(--border);
    background:var(--panel);
    backdrop-filter:blur(6px);
    border-radius:12px;
    box-shadow:0 0 24px rgba(0,255,65,.08), inset 0 0 24px rgba(0,255,65,.04);
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:46px;height:46px;border-radius:10px;
    border:1px solid var(--green);
    display:flex;align-items:center;justify-content:center;
    color:var(--green);font-size:20px;
    background:rgba(0,255,65,.08);
    box-shadow:0 0 18px var(--green-glow) inset, 0 0 14px var(--green-glow);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 18px var(--green-glow) inset, 0 0 14px var(--green-glow);}
    50%{box-shadow:0 0 30px var(--green-glow) inset, 0 0 26px var(--green-glow);}
  }
  .brand h1{
    font-size:17px;letter-spacing:2px;color:var(--green);
    text-shadow:0 0 8px var(--green-glow);
  }
  .brand .subtitle{
    font-size:11px;color:#5fbf7a;margin-top:3px;letter-spacing:1px;
  }
  .brand .subtitle::before{content:"// ";opacity:.6}

  /* Instagram button */
  .ig-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 14px;
    border:1px solid #ff3b8b;
    border-radius:9px;
    color:#ff8bc0;
    background:linear-gradient(135deg, rgba(255,59,139,.12), rgba(255,178,102,.08));
    text-decoration:none;
    font-size:12.5px;letter-spacing:.6px;
    transition:.2s;
    box-shadow:0 0 12px rgba(255,59,139,.25);
  }
  .ig-btn:hover{
    background:linear-gradient(135deg,#ff3b8b,#ffb266);
    color:#0d0208;
    box-shadow:0 0 22px rgba(255,59,139,.6);
    transform:translateY(-1px);
  }
  .ig-btn svg{width:16px;height:16px;fill:currentColor}

  /* TABS */
  .tabs{
    display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;
  }
  .tab{
    flex:1;min-width:150px;
    padding:13px 12px;
    font-family:inherit;
    font-size:13px;letter-spacing:1.4px;
    color:#5fbf7a;
    background:rgba(0,20,5,.6);
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
    text-align:center;
  }
  .tab:hover{color:var(--green);border-color:var(--green);}
  .tab.active{
    color:var(--green);
    background:rgba(0,255,65,.1);
    border-color:var(--green);
    box-shadow:0 0 18px rgba(0,255,65,.35), inset 0 0 18px rgba(0,255,65,.08);
    text-shadow:0 0 6px var(--green-glow);
  }

  .tab-panel{display:none;animation:fadeUp .35s ease}
  .tab-panel.active{display:block}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* CARD */
  .card{
    border:1px solid var(--border);
    background:var(--panel);
    backdrop-filter:blur(6px);
    border-radius:14px;
    padding:22px 20px;
    box-shadow:0 0 30px rgba(0,255,65,.08), inset 0 0 40px rgba(0,255,65,.03);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--green), transparent);
    animation:scan 3s linear infinite;
    opacity:.6;
  }
  @keyframes scan{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(100%)}
  }

  .card-title{
    font-size:12px;color:#5fbf7a;letter-spacing:2px;
    margin-bottom:18px;
    display:flex;align-items:center;gap:8px;
  }

    content:"▸";color:var(--green);text-shadow:0 0 6px var(--green-glow);
  }
  .cursor{

    margin-left:2px;vertical-align:-2px;
    animation:blink 1s steps(1) infinite;
    box-shadow:0 0 8px var(--green-glow);
  }

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{

  }
  td{padding:11px 12px;border-top:1px solid rgba(0,255,65,.12);color:var(--text)}
  tbody tr{transition:.15s}
  tbody tr:hover{background:rgba(0,255,65,.05)}
  .tag{
    display:inline-block;padding:3px 9px;border-radius:6px;

  }
  .tag.eh{color:#ff8b8b;border-color:#ff8b8b;background:rgba(255,80,80,.1)}
  .tag.fx{color:#7cf9b6;border-color:#7cf9b6;background:rgba(80,255,150,.1)}

  .empty,.loader{

  }
  .spinner{
    display:inline-block;width:22px;height:22px;border:2px solid var(--border);
    border-top-color:var(--green);border-radius:50%;
    animation:spin .8s linear infinite;margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* WARNING BANNER */
  .warn{
    display:none;
    padding:10px 14px;
    border:1px solid #ffb84d;
    background:rgba(255,184,77,.08);
    color:#ffd28a;
    font-size:11.5px;
    border-radius:9px;
    margin-bottom:14px;
    letter-spacing:.4px;
    line-height:1.5;

  /* OVERLAY */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:24px;
    backdrop-filter:blur(4px);
  }
  .overlay.show{display:flex}
  .overlay .tick{
    width:96px;height:96px;border-radius:50%;
    border:2px solid var(--green);
    display:flex;align-items:center;justify-content:center;
    color:var(--green);font-size:52px;
    box-shadow:0 0 40px var(--green-glow), inset 0 0 40px rgba(0,255,65,.15);
    margin-bottom:20px;
    animation:pop .45s ease, pulse 1.6s ease-in-out infinite;
  }
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .overlay h2{
    color:var(--green);font-size:20px;letter-spacing:3px;
    text-shadow:0 0 12px var(--green-glow);margin-bottom:10px;
  }
  .overlay p{color:#5fbf7a;font-size:13px;letter-spacing:.8px;line-height:1.7}
  .overlay a{
    margin-top:16px;
    color:#ff8bc0;text-decoration:none;font-size:12px;
    border-bottom:1px dashed #ff3b8b;padding-bottom:2px;
  }
  .overlay a:hover{color:#ff3b8b}

  /* FOOTER */
  footer{
    margin-top:26px;text-align:center;
    color:#2f7a45;font-size:11.5px;letter-spacing:1.2px;
  }
  footer a{
    color:#ff8bc0;text-decoration:none;
    border-bottom:1px dashed #ff3b8b;
    transition:.2s;
  }
  footer a:hover{color:#ff3b8b;text-shadow:0 0 8px rgba(255,59,139,.6)}
  footer .heart{color:#ff3b8b;animation:beat 1.2s infinite}
  @keyframes beat{50%{opacity:.4}}

  @media (max-width:480px){
    .brand h1{font-size:14px;letter-spacing:1.4px}
    .logo{width:40px;height:40px;font-size:17px}
    .tab{font-size:11.5px;letter-spacing:1px;padding:11px 8px;min-width:120px}
    .card{padding:18px 15px}
  }
</style>

<script>
/* ============================================================
   ▼▼▼  PASTE YOUR GOOGLE APPS SCRIPT URL BELOW  ▼▼▼
   It must start with https:// and end with /exec
   ============================================================ */
const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
/* ============================================================ */

const IG_LINK = "https://www.instagram.com/bilxnvyy";

/* ============ MATRIX RAIN ============ */
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let w, h, cols, drops, fs = 15;
  const chars = 'アカサタナハマヤラワ0123456789ABCDEF<>/\\{}[]$#@%&*+=?';

  function init(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / fs);
    drops = new Array(cols).fill(1).map(()=>Math.random()*h/fs);
    ctx.font = fs + 'px "Share Tech Mono", monospace';
  }
  init();
  window.addEventListener('resize', init);

  let last = 0;
  function draw(t){
    if (t - last > 55){
      last = t;
      ctx.fillStyle = 'rgba(0,0,0,.08)';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < cols; i++){
        const ch = chars[(Math.random()*chars.length)|0];
        const y = drops[i]*fs;
        if (Math.random() > .985){
          ctx.fillStyle = '#ccffd6';
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = 'rgba(0,255,65,' + (0.35 + Math.random()*0.5) + ')';
          ctx.shadowBlur = 0;
        }
        ctx.fillText(ch, i*fs, y);
        ctx.shadowBlur = 0;
        if (y > h && Math.random() > .975) drops[i] = 0;
        drops[i]++;
      }
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ============ TAB SWITCHING ============ */
const tabs = document.querySelectorAll('.tab');
const panels = { form: document.getElementById('tab-form'), view: document.getElementById('tab-view') };
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  Object.values(panels).forEach(p => p.classList.remove('active'));
  panels[t.dataset.tab].classList.add('active');
  if (t.dataset.tab === 'view') loadRecords();
}));

/* ============ CONFIG CHECK ============ */
const configured = SCRIPT_URL && SCRIPT_URL.startsWith('http') && !SCRIPT_URL.includes('PASTE_YOUR');
const warnBox = document.getElementById('warnBox');
if (!configured) {
  warnBox.style.display = 'block';
  warnBox.innerHTML = '⚠ SCRIPT_URL not configured. Data will be saved locally only. Paste your Apps Script /exec URL into the code to enable Google Sheets.';
}

/* ============ QR CODE ============ */
const qrToggle = document.getElementById('showQR');
const qrBox = document.getElementById('qrbox');
qrToggle.addEventListener('click', function(){
  qrBox.style.display = qrBox.style.display === 'block' ? 'none' : 'block';
  if (qrBox.dataset.made) return;
  const url = location.href.split('#')[0].split('?')[0];
  document.getElementById('qrurl').textContent = url;
  if (typeof QRCode === 'undefined') {
    document.getElementById('qrcode').innerHTML =
      '<div style="color:#0d0208;padding:20px;font-size:12px">QR library failed to load.</div>';
    return;
  }
  QRCode.toCanvas(document.createElement('canvas'), url, {
    width: 240, margin: 1,
    color: { dark: '#0d0208', light: '#ffffff' }
  }, function(err, canvas){
    if (err) return;
    document.getElementById('qrcode').appendChild(canvas);
    qrBox.dataset.made = '1';
  });
});

/* ============ FORM SUBMIT ============ */
const form = document.getElementById('form');
const btn = document.getElementById('submitBtn');
const overlay = document.getElementById('overlay');

form.addEventListener('submit', async function(e){
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = '▶ Transmitting…';

  const data = new FormData(form);
  const now = new Date();
  data.append('timestamp', now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }));
  data.append('date', now.toLocaleDateString('en-IN'));

  // Always keep a local backup
  try {
    const backup = JSON.parse(localStorage.getItem('attendance_backup') || '[]');
    backup.push(Object.fromEntries(data.entries()));
    localStorage.setItem('attendance_backup', JSON.stringify(backup));
  } catch(_){}

  if (configured) {
    try {
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: data });
    } catch(err){ console.warn('Send failed:', err); }
  }

  // Small delay so user sees the terminal "transmitting" state
  setTimeout(() => {
    overlay.classList.add('show');
    setTimeout(() => {
      overlay.classList.remove('show');
      form.reset();
      btn.disabled = false;
      btn.textContent = '▶ Submit Attendance';
    }, 2200);
  }, 500);
});

/* ============ VIEW RECORDS ============ */
let allRows = [];
let loadedOnce = false;

async function loadRecords(){
  const content = document.getElementById('content');
  if (loadedOnce) return;

  content.innerHTML = '<div class="loader"><div class="spinner"></div><br>Decrypting records…</div>';

  // Try Google Sheets first
  if (configured) {
    try {
      const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
      const data = await res.json();
      if (Array.isArray(data)) {
        allRows = data;
        loadedOnce = true;
        renderRecords();
        return;
      }
    } catch(err){
      console.warn('Sheet fetch failed, falling back to local:', err);
    }
  }

  // Fallback to localStorage
  try {
    const local = JSON.parse(localStorage.getItem('attendance_backup') || '[]');
    allRows = local.map(r => ({
      Name: r.name, Batch: r.batch, Time: r.time, Course: r.course,
      Date: r.date, Timestamp: r.timestamp
    }));
  } catch(_){ allRows = []; }

  loadedOnce = true;
  renderRecords();
}

function renderRecords(){
  const q = document.getElementById('search').value.toLowerCase().trim();
  const course = document.getElementById('courseFilter').value;
  const batch = document.getElementById('batchFilter').value;

  let rows = allRows.filter(r => {
    const nameOk = !q || String(r.Name || '').toLowerCase().includes(q);
    const courseOk = !course || r.Course === course;
    const batchOk = !batch || r.Batch === batch;
    return nameOk && courseOk && batchOk;
  });
  rows = rows.slice().reverse();

  const total = allRows.length;
  const eh = allRows.filter(r => r.Course === 'Ethical Hacking').length;
  const fx = allRows.filter(r => r.Course === 'Forex Trading').length;
  const today = new Date().toLocaleDateString('en-IN');
  const todayCount = allRows.filter(r => String(r.Date || '').includes(today)).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${total}</b><span>Total</span></div>
    <div class="stat"><b>${todayCount}</b><span>Today</span></div>
    <div class="stat"><b>${eh}</b><span>Hacking</span></div>
    <div class="stat"><b>${fx}</b><span>Forex</span></div>
  `;

  const content = document.getElementById('content');

  if (!rows.length) {
    content.innerHTML = '<div class="empty">// No records found.<br>// Waiting for data input…</div>';
    return;
  }

  let html = '<div class="tablewrap"><table><thead><tr>' +
    '<th>#</th><th>Name</th><th>Batch</th><th>Time</th><th>Course</th><th>Date</th>' +
    '</tr></thead><tbody>';

  rows.forEach((r, i) => {
    const tag = r.Course === 'Ethical Hacking'
      ? '<span class="tag eh">ETHICAL HACKING</span>'
      : '<span class="tag fx">FOREX TRADING</span>';
    html += `<tr>
      <td>${String(i+1).padStart(2,'0')}</td>
      <td><b>${escapeHtml(r.Name || '—')}</b></td>
      <td>${escapeHtml(r.Batch || '—')}</td>
      <td>${escapeHtml(r.Time || '—')}</td>
      <td>${tag}</td>
      <td>${escapeHtml(String(r.Date || '—'))}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  content.innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

document.getElementById('search').addEventListener('input', renderRecords);
document.getElementById('courseFilter').addEventListener('change', renderRecords);
document.getElementById('batchFilter').addEventListener('change', renderRecords);

/* ============ TYPING EFFECT ON TITLE (bonus) ============ */
(function typeTitle(){
  const el = document.querySelector('.brand h1');
  const original = 'ATTENDANCE.SYS';
  let i = 0;
  el.textContent = '';
  const t = setInterval(() => {
    el.textContent += original[i];
    i++;
    if (i >= original.length) clearInterval(t);
  }, 70);
})();
</script>
